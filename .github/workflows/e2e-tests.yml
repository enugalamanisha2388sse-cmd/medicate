name: Medicate Appium E2E Tests and Excel Report

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - auth
          - patient
          - reports

env:
  FLUTTER_VERSION: '3.22.0'
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  ANDROID_API_LEVEL: '33'
  ANDROID_TARGET: 'default'
  ANDROID_ARCH: 'x86_64'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build Flutter APK
  # ─────────────────────────────────────────────────────────────────────────────
  build-flutter:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: medicate
        run: flutter pub get

      - name: Flutter analyze
        working-directory: medicate
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build debug APK
        working-directory: medicate
        run: |
          flutter build apk --debug \
            --target-platform android-x64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medicate-debug-apk
          path: medicate/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Run Appium E2E Tests
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: Appium E2E Tests
    runs-on: ubuntu-latest
    needs: build-flutter
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: e2e-tests/package.json

      - name: Install E2E test dependencies
        working-directory: e2e-tests
        run: npm ci

      - name: Install Appium and Flutter Driver
        run: |
          npm install -g appium@latest
          appium driver install flutter
          appium driver install uiautomator2

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: medicate-debug-apk
          path: medicate/build/app/outputs/flutter-apk/

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: pixel_5
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            echo "Emulator ready"

            adb install -r medicate/build/app/outputs/flutter-apk/app-debug.apk
            echo "APK installed"

            appium --log ./e2e-tests/logs/appium.log &
            APPIUM_PID=$!
            sleep 8
            echo "Appium server started"

            cd e2e-tests

            TEST_SUITE="${{ github.event.inputs.test_suite }}"
            if [ "$TEST_SUITE" = "auth" ]; then
              SPECS="tests/auth/**/*.spec.js"
            elif [ "$TEST_SUITE" = "patient" ]; then
              SPECS="tests/patient/**/*.spec.js"
            elif [ "$TEST_SUITE" = "reports" ]; then
              SPECS="tests/reports/**/*.spec.js"
            else
              SPECS="tests/**/*.spec.js"
            fi

            PLATFORM=android BUILD_NUMBER=${{ github.run_number }} \
              npx wdio run wdio.config.js --spec "$SPECS" || true

            kill $APPIUM_PID || true
            echo "Tests finished"

      - name: Upload Excel test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicate-e2e-excel-report-${{ github.run_number }}
          path: |
            e2e-tests/reports/*.xlsx
            e2e-tests/reports/app-reports/*.xlsx
          retention-days: 30

      - name: Upload Appium logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-logs-${{ github.run_number }}
          path: e2e-tests/logs/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Publish Report Summary
  # ─────────────────────────────────────────────────────────────────────────────
  publish-report:
    name: Publish Report Summary
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Excel report
        uses: actions/download-artifact@v4
        with:
          name: medicate-e2e-excel-report-${{ github.run_number }}
          path: ./downloaded-reports/
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ExcelJS
        working-directory: e2e-tests
        run: npm ci

      - name: Generate GitHub Step Summary
        working-directory: e2e-tests
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BRANCH_NAME: ${{ github.ref_name }}
          PLATFORM: ${{ github.event.inputs.platform || 'android' }}
          TRIGGERED_BY: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: node scripts/generate-summary.js

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Medicate E2E Test Results',
              '',
              '| Field | Value |',
              '|-------|-------|',
              `| Build | #${context.runNumber} |`,
              `| Platform | android |`,
              `| Branch | ${context.payload.pull_request.head.ref} |`,
              '',
              `Download the full Excel report from the [Actions run](${runUrl}).`,
              '',
              '> Generated by Medicate Appium E2E Pipeline'
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
