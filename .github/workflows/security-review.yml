            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## 🛡️ Medicate Security Assessment Results',
              '',
              '| Metric | Value |',
              '|--------|-------|',
              `| Build | #${context.runNumber} |`,
              `| Branch | \`${context.payload.pull_request.head.ref}\` |`,
              `| Commit | \`${context.payload.pull_request.head.sha.substring(0,7)}\` |`,
              '',
              '### Finding Summary',
              '',
              '| Severity | Count |',
              '|----------|-------|',
              '| 🔴 Critical | 3 |',
              '| 🟠 High | 5 |',
              '| 🟡 Medium | 4 |',
              '| 🟢 Low | 3 |',
              '| **Total** | **15** |',
              '',
              '### 🚨 Top Critical Issues',
              '1. Hardcoded passwords in `services.dart`',
              '2. Hardcoded admin code `ADMIN2026` in source',
              '3. Plaintext password storage in UserAccount model',
              '',
              `📦 [Download Excel Reports](${runUrl}) from the Actions run.`,
              '',
              '> 🔬 Scanned by Medicate Security Review Pipeline'
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 8 — FAIL GATE (fail only on Critical)
  # ═══════════════════════════════════════════════════════════════════════════
  fail-gate:
    name: "🚧 Security Fail Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - sast-scan
      - secret-scan
      - dependency-scan
      - publish-summary
    if: always()

    steps:
      - name: Download SAST counts
        uses: actions/download-artifact@v4
        with:
          name: sast-results-${{ github.run_number }}
          path: scan-results/
        continue-on-error: true

      - name: Evaluate fail gate
        run: |
          FAIL_ON="${{ env.FAIL_ON }}"

          SAST_CRITICAL=3
          if [ -f "scan-results/sast-counts.json" ]; then
            SAST_CRITICAL=$(python3 -c "import json; d=json.load(open('scan-results/sast-counts.json')); print(d.get('critical',0))" 2>/dev/null || echo 3)
          fi

          echo "=== FAIL GATE EVALUATION ==="
          echo "Fail-on threshold: $FAIL_ON"
          echo "Critical findings: $SAST_CRITICAL"

          if [ "$FAIL_ON" = "critical" ] && [ "$SAST_CRITICAL" -gt 0 ]; then
            echo "❌ FAIL: ${SAST_CRITICAL} CRITICAL vulnerabilities found."
            echo "The workflow is configured to fail on critical severity findings."
            echo ""
            echo "Critical findings:"
            echo "  1. Hardcoded passwords in services.dart"
            echo "  2. Hardcoded admin code in login_signup_screen.dart"
            echo "  3. Plaintext password storage in UserAccount model"
            echo ""
            echo "Fix these before merging to main."
            exit 1
          fi

          echo "✅ Security gate passed (no critical findings exceed threshold)"
