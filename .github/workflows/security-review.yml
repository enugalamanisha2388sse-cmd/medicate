name: "🛡️ Medicate Security Review — SAST | DAST | Dependencies | Secrets"

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER CONDITIONS
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Security scan mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - sast-only
          - dependency-only
          - secrets-only
      fail_on_severity:
        description: "Fail workflow on this severity or above"
        required: true
        default: "critical"
        type: choice
        options:
          - critical
          - high
          - medium
          - low
      generate_excel:
        description: "Generate Excel reports"
        required: false
        default: "true"
        type: boolean

# ─────────────────────────────────────────────────────────────────────────────
# GLOBAL ENVIRONMENT
# ─────────────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  FLUTTER_VERSION: "3.24.0"
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  REPORTS_DIR: "Vulnerability Test Results"
  SCAN_MODE: ${{ github.event.inputs.scan_mode || 'full' }}
  FAIL_ON: ${{ github.event.inputs.fail_on_severity || 'critical' }}

# Cancel older runs on same branch
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — BACKEND DISCOVERY & TECH INVENTORY
  # ═══════════════════════════════════════════════════════════════════════════
  backend-discovery:
    name: "📋 Phase 1 — Backend & Tech Discovery"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tech_stack: ${{ steps.detect.outputs.tech_stack }}
      has_flutter: ${{ steps.detect.outputs.has_flutter }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_dart: ${{ steps.detect.outputs.has_dart }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect technology stack
        id: detect
        run: |
          echo "=== MEDICATE BACKEND DISCOVERY ==="

          HAS_FLUTTER=false
          HAS_NODE=false
          HAS_DART=false
          TECH_STACK=""

          # Flutter/Dart detection
          if [ -f "medicate/pubspec.yaml" ]; then
            HAS_FLUTTER=true
            HAS_DART=true
            TECH_STACK="Flutter/Dart"
            echo "✅ Flutter App detected"
            echo "  → pubspec.yaml found"
            grep -E "^  [a-z]" medicate/pubspec.yaml | head -30 || true
          fi

          # Node.js detection (E2E, Appium, Selenium)
          for dir in e2e-tests appium-tests selenium-tests; do
            if [ -f "$dir/package.json" ]; then
              HAS_NODE=true
              TECH_STACK="${TECH_STACK}, Node.js ($dir)"
              echo "✅ Node.js project detected in $dir"
              cat "$dir/package.json" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(f'  → dep: {k}@{v}') for k,v in {**d.get('dependencies',{}), **d.get('devDependencies',{})}.items()]"
            fi
          done

          echo "tech_stack=${TECH_STACK}" >> $GITHUB_OUTPUT
          echo "has_flutter=${HAS_FLUTTER}" >> $GITHUB_OUTPUT
          echo "has_node=${HAS_NODE}" >> $GITHUB_OUTPUT
          echo "has_dart=${HAS_DART}" >> $GITHUB_OUTPUT

          echo ""
          echo "=== INVENTORY SUMMARY ==="
          echo "Tech Stack: ${TECH_STACK}"

      - name: Generate inventory report
        run: |
          mkdir -p "${{ env.REPORTS_DIR }}"
          cat > "${{ env.REPORTS_DIR }}/backend-inventory.md" << 'INVENTORY_EOF'
          # 📋 Medicate Backend Inventory Report

          ## Application Overview
          | Property | Value |
          |----------|-------|
          | App Name | Medicate / SmartMed |
          | Type | Flutter Mobile App + E2E Test Suite |
          | Version | 1.0.0+1 |
          | Scan Date | $(date -u '+%Y-%m-%d %H:%M UTC') |

          ## Technology Stack
          | Layer | Technology | Version |
          |-------|-----------|---------|
          | Mobile App | Flutter | 3.22.0 |
          | Language | Dart | ^3.11.5 |
          | UI Framework | Material Design 3 | Latest |
          | State Management | Provider | ^6.1.2 |
          | HTTP Client | http | ^1.2.0 |
          | Maps | flutter_map | ^6.1.0 |
          | Charts | fl_chart | ^0.69.0 |
          | E2E Tests | WebdriverIO + Appium | ^8.39.0 |
          | UI Tests | Selenium WebDriver | ^4.21.0 |
          | Report Gen | ExcelJS | ^4.4.0 |

          ## Architecture
          - **Auth Model**: Role-based (Patient, Doctor, Admin) — in-memory mock
          - **Session**: Provider-state (no persistent token)
          - **Database**: In-memory Dart lists (no backend DB)
          - **API**: No REST API — purely client-side Flutter state
          - **ORM**: None (no DB)

          ## Key Security Surfaces
          - Hardcoded credentials in `services.dart`
          - Admin code hardcoded in `login_signup_screen.dart`
          - Plaintext password storage in UserAccount model
          - Client-side authentication (no server validation)
          - Demo credentials exposed in UI
          INVENTORY_EOF

          echo "✅ Backend inventory report generated"

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: backend-inventory
          path: "${{ env.REPORTS_DIR }}/backend-inventory.md"
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — SAST (STATIC APPLICATION SECURITY TESTING)
  # ═══════════════════════════════════════════════════════════════════════════
  sast-scan:
    name: "🔍 Phase 3 — SAST (Static Code Analysis)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend-discovery

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Flutter
        if: needs.backend-discovery.outputs.has_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        if: needs.backend-discovery.outputs.has_flutter == 'true'
        working-directory: medicate
        run: |
          echo "=== INSTALLING FLUTTER DEPENDENCIES ==="
          flutter pub get
          echo "✅ Flutter dependencies installed successfully"

      - name: Flutter static analysis (dart analyze)
        if: needs.backend-discovery.outputs.has_flutter == 'true'
        working-directory: medicate
        run: |
          echo "=== FLUTTER STATIC ANALYSIS ==="
          flutter analyze --no-fatal-infos 2>&1 | tee ../flutter-analyze.txt || true
          echo "Flutter analyze complete"
        continue-on-error: true

      - name: Install SAST tools
        run: |
          pip install semgrep 2>/dev/null || pip install semgrep --break-system-packages || true
          echo "✅ Semgrep installed"

      - name: Run Semgrep SAST — Security rules
        run: |
          mkdir -p "${{ env.REPORTS_DIR }}"
          echo "=== SEMGREP SAST SCAN ==="

          # Run against all code with security ruleset
          semgrep scan \
            --config "p/security-audit" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --json \
            --output "${{ env.REPORTS_DIR }}/semgrep-results.json" \
            --error \
            . 2>/dev/null || true

          # Also run with default rules
          semgrep scan \
            --config "auto" \
            --json \
            --output "${{ env.REPORTS_DIR }}/semgrep-auto.json" \
            . 2>/dev/null || true

          echo "✅ Semgrep scan complete"
        continue-on-error: true

      - name: Run custom SAST checks (Medicate-specific)
        run: |
          mkdir -p "${{ env.REPORTS_DIR }}"
          echo "=== CUSTOM SECURITY CHECKS ==="

          FINDINGS=""
          CRITICAL_COUNT=0
          HIGH_COUNT=0
          MEDIUM_COUNT=0
          LOW_COUNT=0

          # ──────────────────────────────────────────────────────────────
          # CHECK 1: Hardcoded Passwords
          # ──────────────────────────────────────────────────────────────
          echo "--- [CRITICAL] Checking hardcoded passwords ---"
          HARDCODED_PWD=$(grep -rn "password.*=.*'password123'" --include="*.dart" . 2>/dev/null || true)
          if [ -n "$HARDCODED_PWD" ]; then
            CRITICAL_COUNT=$((CRITICAL_COUNT+1))
            echo "❌ CRITICAL: Hardcoded passwords found"
            echo "$HARDCODED_PWD"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 2: Hardcoded Admin Code
          # ──────────────────────────────────────────────────────────────
          echo "--- [CRITICAL] Checking hardcoded admin codes ---"
          ADMIN_CODE=$(grep -rn "ADMIN2026\|adminCode\|admin_code" --include="*.dart" . 2>/dev/null || true)
          if [ -n "$ADMIN_CODE" ]; then
            CRITICAL_COUNT=$((CRITICAL_COUNT+1))
            echo "❌ CRITICAL: Hardcoded admin verification code found"
            echo "$ADMIN_CODE"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 3: Plaintext Password Storage
          # ──────────────────────────────────────────────────────────────
          echo "--- [CRITICAL] Checking plaintext password storage ---"
          PLAIN_PWD=$(grep -rn "password.*String\|final String password" --include="*.dart" . 2>/dev/null || true)
          if [ -n "$PLAIN_PWD" ]; then
            CRITICAL_COUNT=$((CRITICAL_COUNT+1))
            echo "❌ CRITICAL: Passwords stored in plaintext (no hashing)"
            echo "$PLAIN_PWD"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 4: Client-side Auth (no server validation)
          # ──────────────────────────────────────────────────────────────
          echo "--- [HIGH] Checking for client-side-only authentication ---"
          CLIENT_AUTH=$(grep -rn "provider.login\|_users.firstWhere" --include="*.dart" . 2>/dev/null || true)
          if [ -n "$CLIENT_AUTH" ]; then
            HIGH_COUNT=$((HIGH_COUNT+1))
            echo "⚠️ HIGH: Client-side-only authentication detected (no server-side validation)"
            echo "$CLIENT_AUTH"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 5: Demo Credentials Exposed in UI
          # ──────────────────────────────────────────────────────────────
          echo "--- [HIGH] Checking demo credentials in UI ---"
          DEMO_CREDS=$(grep -rn "demoEmail\|password123\|Demo:" --include="*.dart" . 2>/dev/null || true)
          if [ -n "$DEMO_CREDS" ]; then
            HIGH_COUNT=$((HIGH_COUNT+1))
            echo "⚠️ HIGH: Demo credentials exposed in UI components"
            echo "$DEMO_CREDS"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 6: Missing RBAC on route navigation
          # ──────────────────────────────────────────────────────────────
          echo "--- [HIGH] Checking RBAC enforcement ---"
          RBAC=$(grep -rn "UserRole.admin.*PatientDashboard\|admin.*same shell" --include="*.dart" . 2>/dev/null || true)
          if [ -n "$RBAC" ]; then
            HIGH_COUNT=$((HIGH_COUNT+1))
            echo "⚠️ HIGH: Admin role routes to PatientDashboard — broken RBAC"
            echo "$RBAC"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 7: Weak OTP simulation
          # ──────────────────────────────────────────────────────────────
          echo "--- [HIGH] Checking OTP implementation ---"
          OTP_WEAK=$(grep -rn "debug console\|simulated\|_pendingOtps" --include="*.dart" . 2>/dev/null || true)
          if [ -n "$OTP_WEAK" ]; then
            HIGH_COUNT=$((HIGH_COUNT+1))
            echo "⚠️ HIGH: Simulated OTP — OTP visible in debug console"
            echo "$OTP_WEAK"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 8: No rate limiting on login
          # ──────────────────────────────────────────────────────────────
          echo "--- [HIGH] Checking rate limiting ---"
          RATE=$(grep -rn "loginAttempts\|rateLimi\|throttle\|lockout" --include="*.dart" . 2>/dev/null || true)
          if [ -z "$RATE" ]; then
            HIGH_COUNT=$((HIGH_COUNT+1))
            echo "⚠️ HIGH: No rate limiting found on authentication endpoints"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 9: Weak password validation
          # ──────────────────────────────────────────────────────────────
          echo "--- [MEDIUM] Checking password policy ---"
          WEAK_PWD=$(grep -rn "v.length < 6\|minLength.*6" --include="*.dart" . 2>/dev/null || true)
          if [ -n "$WEAK_PWD" ]; then
            MEDIUM_COUNT=$((MEDIUM_COUNT+1))
            echo "⚠️ MEDIUM: Weak password policy — minimum 6 characters (should be 12+ with complexity)"
            echo "$WEAK_PWD"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 10: Sensitive data in logs/notifications
          # ──────────────────────────────────────────────────────────────
          echo "--- [MEDIUM] Checking sensitive data in logs ---"
          SENS_LOG=$(grep -rn "addNotification.*SUCCESS.*\|print.*password\|debugPrint.*email" --include="*.dart" . 2>/dev/null || true)
          if [ -n "$SENS_LOG" ]; then
            MEDIUM_COUNT=$((MEDIUM_COUNT+1))
            echo "⚠️ MEDIUM: Sensitive operation details logged in notifications"
            echo "$SENS_LOG"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 11: Email validation bypass
          # ──────────────────────────────────────────────────────────────
          echo "--- [MEDIUM] Checking email validation ---"
          EMAIL_VAL=$(grep -rn "!v.contains('@')" --include="*.dart" . 2>/dev/null || true)
          if [ -n "$EMAIL_VAL" ]; then
            MEDIUM_COUNT=$((MEDIUM_COUNT+1))
            echo "⚠️ MEDIUM: Weak email validation — contains('@') is insufficient"
            echo "$EMAIL_VAL"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 12: Missing session management
          # ──────────────────────────────────────────────────────────────
          echo "--- [MEDIUM] Checking session management ---"
          SESSION=$(grep -rn "SharedPreferences\|FlutterSecureStorage\|jwt\|token" --include="*.dart" . 2>/dev/null || true)
          if [ -z "$SESSION" ]; then
            MEDIUM_COUNT=$((MEDIUM_COUNT+1))
            echo "⚠️ MEDIUM: No persistent session management (no SecureStorage/JWT)"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 13: Hardcoded API base URLs
          # ──────────────────────────────────────────────────────────────
          echo "--- [LOW] Checking hardcoded URLs ---"
          URLS=$(grep -rn "http://\|https://" --include="*.dart" . 2>/dev/null || true)
          if [ -n "$URLS" ]; then
            LOW_COUNT=$((LOW_COUNT+1))
            echo "ℹ️ LOW: Hardcoded URLs detected"
            echo "$URLS"
          fi

          # ──────────────────────────────────────────────────────────────
          # CHECK 14: Debug mode artifacts
          # ──────────────────────────────────────────────────────────────
          echo "--- [LOW] Checking debug mode artifacts ---"
          DEBUG=$(grep -rn "debugPrint\|kDebugMode\|assert(" --include="*.dart" . 2>/dev/null | head -10 || true)
          if [ -n "$DEBUG" ]; then
            LOW_COUNT=$((LOW_COUNT+1))
            echo "ℹ️ LOW: Debug artifacts present (acceptable in dev builds)"
            echo "$DEBUG"
          fi

          # ── SAVE COUNTS ─────────────────────────────────────────────
          cat > "${{ env.REPORTS_DIR }}/sast-counts.json" << EOF
          {
            "critical": $CRITICAL_COUNT,
            "high": $HIGH_COUNT,
            "medium": $MEDIUM_COUNT,
            "low": $LOW_COUNT,
            "total": $((CRITICAL_COUNT + HIGH_COUNT + MEDIUM_COUNT + LOW_COUNT))
          }
          EOF

          echo ""
          echo "=== SAST SUMMARY ==="
          echo "Critical: $CRITICAL_COUNT"
          echo "High:     $HIGH_COUNT"
          echo "Medium:   $MEDIUM_COUNT"
          echo "Low:      $LOW_COUNT"
          echo "Total:    $((CRITICAL_COUNT + HIGH_COUNT + MEDIUM_COUNT + LOW_COUNT))"

      - name: Flutter pub audit (dependency security)
        if: needs.backend-discovery.outputs.has_flutter == 'true'
        working-directory: medicate
        run: |
          echo "=== FLUTTER DEPENDENCY AUDIT ==="
          flutter pub outdated --json 2>/dev/null | python3 -c "
          import json, sys
          try:
            data = json.load(sys.stdin)
            pkgs = data.get('packages', [])
            outdated = [p for p in pkgs if p.get('current') != p.get('latest')]
            print(f'Total packages: {len(pkgs)}')
            print(f'Outdated packages: {len(outdated)}')
            for p in outdated[:20]:
              print(f'  {p[\"package\"]}: {p.get(\"current\",\"?\")} → {p.get(\"latest\",\"?\")}')
          except:
            print('No outdated package data available')
          " 2>/dev/null || true
        continue-on-error: true

      - name: Upload SAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-results-${{ github.run_number }}
          path: |
            ${{ env.REPORTS_DIR }}/semgrep-results.json
            ${{ env.REPORTS_DIR }}/semgrep-auto.json
            ${{ env.REPORTS_DIR }}/sast-counts.json
            flutter-analyze.txt
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 — SECRET SCANNING (Gitleaks)
  # ═══════════════════════════════════════════════════════════════════════════
  secret-scan:
    name: "🔑 Phase 5a — Secret & Credential Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-discovery

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks — secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Run custom secret scan
        run: |
          mkdir -p "${{ env.REPORTS_DIR }}"
          echo "=== CUSTOM SECRET SCAN ==="

          SECRET_COUNT=0

          # Scan for common secret patterns
          PATTERNS=(
            "password.*=.*'[^']{6,}'"
            "ADMIN[0-9]{4}"
            "api[_-]?key.*=.*['\"][A-Za-z0-9]{16,}"
            "secret.*=.*['\"][A-Za-z0-9]{16,}"
            "token.*=.*['\"][A-Za-z0-9]{20,}"
            "private[_-]?key"
            "-----BEGIN.*PRIVATE KEY-----"
          )

          echo "Pattern scan results:" > "${{ env.REPORTS_DIR }}/secret-scan.txt"

          for pattern in "${PATTERNS[@]}"; do
            RESULT=$(grep -rniE "$pattern" --include="*.dart" --include="*.js" --include="*.json" --include="*.yaml" --include="*.yml" . 2>/dev/null | grep -v node_modules | grep -v ".git" || true)
            if [ -n "$RESULT" ]; then
              SECRET_COUNT=$((SECRET_COUNT+1))
              echo "⚠️ Found pattern: $pattern" >> "${{ env.REPORTS_DIR }}/secret-scan.txt"
              echo "$RESULT" >> "${{ env.REPORTS_DIR }}/secret-scan.txt"
              echo "" >> "${{ env.REPORTS_DIR }}/secret-scan.txt"
            fi
          done

          echo ""
          echo "Secret patterns found: $SECRET_COUNT"
          cat "${{ env.REPORTS_DIR }}/secret-scan.txt"

      - name: Upload secret scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results-${{ github.run_number }}
          path: ${{ env.REPORTS_DIR }}/secret-scan.txt
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4 — DEPENDENCY VULNERABILITY SCAN (Trivy + npm audit)
  # ═══════════════════════════════════════════════════════════════════════════
  dependency-scan:
    name: "📦 Phase 5b — Dependency Vulnerability Scan (Trivy + npm audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-discovery

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy 2>/dev/null || \
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Run Trivy — filesystem scan
        run: |
          mkdir -p "${{ env.REPORTS_DIR }}"
          echo "=== TRIVY FILESYSTEM SCAN ==="

          # Full filesystem scan
          trivy fs \
            --format json \
            --output "${{ env.REPORTS_DIR }}/trivy-results.json" \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --skip-dirs ".git,build,node_modules/.cache" \
            . 2>/dev/null || true

          # Human-readable table scan
          trivy fs \
            --format table \
            --severity MEDIUM,HIGH,CRITICAL \
            --skip-dirs ".git,build,node_modules/.cache" \
            . 2>/dev/null | tee "${{ env.REPORTS_DIR }}/trivy-table.txt" || true

          echo "✅ Trivy scan complete"
        continue-on-error: true

      - name: Run npm audit — E2E tests
        run: |
          echo "=== NPM AUDIT: e2e-tests ==="
          cd e2e-tests
          npm install --prefer-offline 2>/dev/null || npm install 2>/dev/null || true
          npm audit --json 2>/dev/null > "../${{ env.REPORTS_DIR }}/npm-audit-e2e.json" || true
          npm audit 2>/dev/null | tee "../${{ env.REPORTS_DIR }}/npm-audit-e2e.txt" || true
          cd ..
        continue-on-error: true

      - name: Run npm audit — Appium tests
        run: |
          echo "=== NPM AUDIT: appium-tests ==="
          cd appium-tests
          npm install --prefer-offline 2>/dev/null || npm install 2>/dev/null || true
          npm audit --json 2>/dev/null > "../${{ env.REPORTS_DIR }}/npm-audit-appium.json" || true
          npm audit 2>/dev/null | tee "../${{ env.REPORTS_DIR }}/npm-audit-appium.txt" || true
          cd ..
        continue-on-error: true

      - name: Run npm audit — Selenium tests
        run: |
          echo "=== NPM AUDIT: selenium-tests ==="
          cd selenium-tests
          npm install --prefer-offline 2>/dev/null || npm install 2>/dev/null || true
          npm audit --json 2>/dev/null > "../${{ env.REPORTS_DIR }}/npm-audit-selenium.json" || true
          npm audit 2>/dev/null | tee "../${{ env.REPORTS_DIR }}/npm-audit-selenium.txt" || true
          cd ..
        continue-on-error: true

      - name: Parse dependency vulnerability counts
        run: |
          echo "=== DEPENDENCY AUDIT SUMMARY ==="
          python3 << 'PYEOF'
          import json, os

          reports_dir = os.environ.get('REPORTS_DIR', 'Vulnerability Test Results')
          audit_files = [
            f"{reports_dir}/npm-audit-e2e.json",
            f"{reports_dir}/npm-audit-appium.json",
            f"{reports_dir}/npm-audit-selenium.json"
          ]

          total = {"critical": 0, "high": 0, "moderate": 0, "low": 0, "info": 0}
          for fpath in audit_files:
            try:
              with open(fpath) as f:
                data = json.load(f)
              meta = data.get('metadata', {}).get('vulnerabilities', {})
              for sev in total:
                total[sev] += meta.get(sev, 0)
              print(f"{os.path.basename(fpath)}: {meta}")
            except Exception as e:
              print(f"  Could not parse {fpath}: {e}")

          print(f"\nAGGREGATE DEPENDENCY VULNERABILITIES:")
          for sev, cnt in total.items():
            print(f"  {sev.upper()}: {cnt}")

          # Write summary
          with open(f"{reports_dir}/dep-counts.json", "w") as f:
            json.dump(total, f, indent=2)
          PYEOF
        env:
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
        continue-on-error: true

      - name: Upload dependency scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
