          path: |
            ${{ env.REPORTS_DIR }}/trivy-results.json
            ${{ env.REPORTS_DIR }}/trivy-table.txt
            ${{ env.REPORTS_DIR }}/npm-audit-e2e.json
            ${{ env.REPORTS_DIR }}/npm-audit-e2e.txt
            ${{ env.REPORTS_DIR }}/npm-audit-appium.json
            ${{ env.REPORTS_DIR }}/npm-audit-appium.txt
            ${{ env.REPORTS_DIR }}/npm-audit-selenium.json
            ${{ env.REPORTS_DIR }}/npm-audit-selenium.txt
            ${{ env.REPORTS_DIR }}/dep-counts.json
          retention-days: 30
          if-no-files-found: warn

